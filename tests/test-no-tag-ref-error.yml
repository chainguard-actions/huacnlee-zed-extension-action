name: Test no-tag ref error
# When no 'tag' input is provided and the workflow is not triggered by a tag push,
# the action should fail with an "invalid ref" error message.
# Under act, github.context.ref is always refs/heads/act-harness (not a tag ref),
# so this scenario is always exercised when tag input is omitted.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        # No 'tag' input provided — action should detect non-tag ref and fail
        with:
          extension-name: my-extension
          zed-extensions: zed-industries/extensions

      - name: Assert action failed with invalid ref error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no tag input and ref is not a tag"
            exit 1
          fi
          echo "PASS: action correctly failed when ref is not a tag"
