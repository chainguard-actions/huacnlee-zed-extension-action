name: Test custom commit-message template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-name: v3.1.4
          extension-name: test-ext
          zed-extensions: ${{ github.repository }}
          create-pullrequest: "false"
          commit-message: |
            Bump {{extensionName}} to {{version}}

            Released at https://github.com/{{owner}}/{{repo}}/releases/tag/v{{version}}

      - name: Assert action ran with custom commit-message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no extensions.toml in this
          # repo, but it must NOT fail with "invalid ref" (tag-name was provided).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom commit-message template (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
