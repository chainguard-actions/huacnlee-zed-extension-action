name: Test custom commit message template
# Verifies the action accepts a custom commit-message template with
# {{extensionName}}, {{version}}, {{owner}}, {{repo}} placeholders.
# The action will fail at the GitHub API stage (tag not found),
# confirming the custom template input was accepted without error.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          extension-name: my-extension
          tag: v99.99.99-nonexistent
          zed-extensions: zed-industries/extensions
          create-pullrequest: "false"
          commit-message: |
            chore: bump {{extensionName}} to {{version}}

            See https://github.com/{{owner}}/{{repo}}/releases/tag/v{{version}}

      - name: Assert action failed at API stage (not at template parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (tag does not exist in repo)"
            exit 1
          fi
          echo "PASS: action accepted custom commit-message template and failed at API stage as expected"
