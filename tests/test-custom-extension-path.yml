name: Test custom extension-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-name: v2.0.0
          extension-name: my-ext
          extension-path: extensions/custom-path/my-ext
          zed-extensions: ${{ github.repository }}
          create-pullrequest: "false"

      - name: Assert action ran with custom extension-path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no extensions.toml in this
          # repo, but it must NOT fail with "invalid ref" (tag-name was provided).
          # Any outcome other than a crash before reaching the API is acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom extension-path (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
