name: Test invalid ref (non-tag push without tag input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: testowner/my-zed-extension
      GITHUB_SHA: abc1234def5678901234567890123456789012345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          extension-name: my-zed-extension
          push-to: testowner/extensions
          zed-extensions: zed-industries/extensions
        env:
          GITHUB_TOKEN: fake-token-for-testing
      - name: Assert action failed due to invalid ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When GITHUB_REF is not a tag and no 'tag' input is provided,
          # the action should fail with "invalid ref" error.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid ref, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when ref is not a tag"
