name: Test invalid ref (no tag-name input, non-tag ref)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No tag-name input provided; context.ref will be refs/heads/act-harness (not a tag),
        # so the action should throw "invalid ref: refs/heads/act-harness"

      - name: Assert action failed due to invalid ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ref is not a tag and no tag-name is given"
            exit 1
          fi
          echo "PASS: action correctly failed for non-tag ref"
