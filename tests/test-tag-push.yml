name: Test tag push scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: testowner/my-zed-extension
      GITHUB_SHA: abc1234def5678901234567890123456789012345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          extension-name: my-zed-extension
          push-to: testowner/extensions
          zed-extensions: zed-industries/extensions
        env:
          GITHUB_TOKEN: fake-token-for-testing
      - name: Assert action failed at API level not at input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of API authentication, not because of
          # missing/invalid inputs. We expect it to fail (no real token), but
          # the failure should not be about invalid ref or missing extension-name.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at API level as expected with fake token"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS"
