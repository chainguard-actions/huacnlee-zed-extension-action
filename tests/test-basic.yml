name: Test basic usage with extension-name and tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          extension-name: my-extension
          tag: v1.2.3
          commit-message: |
            Update my-extension to v1.2.3

            Release notes:

            https://github.com/owner/repo/releases/tag/v1.2.3
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real GitHub credentials,
          # but it should not fail due to input validation errors.
          # We verify the step ran (not skipped) and inputs were accepted.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with extension-name and tag inputs"
