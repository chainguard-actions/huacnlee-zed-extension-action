name: Test default extension path derivation
# When extension-name is provided but extension-path is not,
# the action derives the path as "extensions/<extension-name>".
# The action will fail at the GitHub API call (tag not found or no push access),
# but the failure confirms the action processed the inputs and reached the API stage.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          extension-name: my-test-extension
          # No extension-path — should default to extensions/my-test-extension
          tag: v99.99.99-nonexistent
          zed-extensions: zed-industries/extensions
          create-pullrequest: "false"

      - name: Assert action failed at API stage (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the tag doesn't exist (API error),
          # not because of missing/invalid inputs. Either way, outcome must be failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (tag does not exist)"
            exit 1
          fi
          echo "PASS: action failed as expected (reached API stage with correct inputs)"
