name: Test push-to input (fork target)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          extension-name: my-extension
          tag-name: v1.2.3
          push-to: octocat/extensions
          create-pullrequest: "false"
        continue-on-error: true
      - name: Assert action ran (push-to input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to missing GitHub credentials or network
          # access in the test environment, but what matters is that the
          # push-to input is accepted and the action starts executing.
          # We accept both success and failure outcomes here — the important
          # thing is that the input is wired up and the action does not
          # immediately reject it with an input-validation error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with push-to input"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
