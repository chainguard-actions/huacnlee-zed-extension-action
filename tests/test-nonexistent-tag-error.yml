name: Test nonexistent tag error
# When a 'tag' input is provided but the tag does not exist in the repository,
# the action should fail with a "Tag not found" error from resolveRef.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          extension-name: my-extension
          tag: v99.99.99-nonexistent
          zed-extensions: zed-industries/extensions

      - name: Assert action failed due to nonexistent tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tag does not exist in the repository"
            exit 1
          fi
          echo "PASS: action correctly failed for nonexistent tag"
